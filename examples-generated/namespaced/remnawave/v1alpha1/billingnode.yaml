apiVersion: remnawave.m.crossplane.io/v1alpha1
kind: BillingNode
metadata:
  annotations:
    meta.upbound.io/example-id: remnawave/v1alpha1/billingnode
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    nextBillingAt: "2027-01-01T00:00:00.000Z"
    providerUuid: ${remnawave_infra_provider.example.uuid}

